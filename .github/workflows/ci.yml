name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Lint, Types, Formatting & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint Check
        run: npm run lint

      - name: TypeScript Check
        run: npm run typecheck

      - name: Dependency Knip Check
        run: npm run knip

      - name: Security Audit
        run: npm run audit

      - name: Repo Hygiene Check
        run: npm run hygiene

  test-and-coverage:
    name: Unit, Property & Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Coverage Tests
        run: npm run test:coverage

      - name: Run Accessibility Tests
        run: npm run test:a11y

  build-and-size:
    name: Build & Client Bundle Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Build
        run: npm run build

      - name: Client Bundle Size Check
        run: npm run size-limit

  e2e-matrix:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: [build-and-size]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Application
        run: npm run build

      - name: Run Playwright Tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          E2E_UPSTREAM_MOCK: 'true'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
